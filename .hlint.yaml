# HLint checks only the plumbing of arrow programs: pure steps are composed as functions inside one arr, and the
# shared combinators of Network.Streaming.Combinators and Network.Streaming.Plumbing are used where they fit. HLint's own hints are ignored.
#
# Run it with: hlint streaming-io native-pg native-pg-tls directions fulmen slice test

- group: {name: default, enabled: false}
- ignore: {}

# --cpp-simple drops the lines of CPP directives, which HLint's own preprocessor fails on in some modules.
- arguments: [--cpp-simple, -XGHC2021, -XArrows, -XLambdaCase, -XMultiWayIf, -XDataKinds, -XTypeFamilies]

# Pure steps in a row are one function.
- warn: {name: Compose pure steps, lhs: arr f >>> arr g, rhs: arr (g . f)}
- warn: {name: Compose pure steps, lhs: f ^>> arr g, rhs: arr (g . f)}
- warn: {name: Compose pure steps, lhs: arr f >>^ g, rhs: arr (g . f)}
- warn: {name: Compose pure steps, lhs: f ^>> (g ^>> x), rhs: (g . f) ^>> x}
- warn: {name: Compose pure steps, lhs: (x >>^ f) >>^ g, rhs: x >>^ (g . f)}
- warn: {name: Compose pure steps, lhs: arr f >>> (g ^>> x), rhs: (g . f) ^>> x}
- warn: {name: Compose pure steps, lhs: (x >>^ f) >>> arr g, rhs: x >>^ (g . f)}

# A pure step next to an IO action, or two IO actions in a row, are one now.
- warn: {name: Fuse into now, lhs: f ^>> now g, rhs: now (g . f)}
- warn: {name: Fuse into now, lhs: f ^>> (now g >>> y), rhs: now (g . f) >>> y}
- warn: {name: Fuse into now, lhs: now g >>^ f, rhs: now (fmap f . g)}
- warn: {name: Fuse into now, lhs: now g >>> now h, rhs: now (g >=> h)}
- warn: {name: Fuse into now, lhs: now g >>> (now h >>> y), rhs: now (g >=> h) >>> y}

# The action between the rounds of a loop is iterateWith's second argument.
- warn: {name: Use iterateWith, lhs: iterateA (x >>> left y), rhs: iterateWith x y}
- warn: {name: Use iterateWith, lhs: iterateA (f ^>> left y), rhs: iterateWith (arr f) y}
- warn: {name: Use iterateWith, lhs: iterateA (x >>^ f >>> left y), rhs: iterateWith (x >>^ f) y}
- warn: {name: Use iterateWith, lhs: iterateA (x >>> (f ^>> left y)), rhs: iterateWith (x >>^ f) y}
- warn: {name: Use iterateWith, lhs: iterateA (x >>> (z >>> left y)), rhs: iterateWith (x >>> z) y}
- warn: {name: Use iterateWith, lhs: iterateA (f ^>> (x >>> left y)), rhs: iterateWith (f ^>> x) y}
- warn: {name: Use iterateWith, lhs: iterateA (x >>> (z >>> (f ^>> left y))), rhs: iterateWith (x >>> z >>^ f) y}

# A pure step before or after an arrow is a function on its input or output.
- warn: {name: Use ^>>, lhs: arr f >>> x, rhs: f ^>> x}
- warn: {name: Use >>^, lhs: x >>> arr f, rhs: x >>^ f}

# Steps that don't depend on each other's results, combined by a function, are applicative.
- warn: {name: Use <*>, lhs: (x &&& y) >>^ uncurry f, rhs: f <$> x <*> y}

# The shared combinators.
- warn: {name: Use done, lhs: arr (const ()), rhs: done}
- warn: {name: Use done, lhs: x >>^ const (), rhs: x >>> done}
- warn: {name: Use dup, lhs: (id &&& id) ^>> x, rhs: dup ^>> x}
- warn: {name: Use dup, lhs: arr (id &&& id), rhs: arr dup}
- warn: {name: Use alongside, lhs: x &&& returnA, rhs: alongside x}
- warn: {name: Use alongside, lhs: dup ^>> first x, rhs: alongside x}
- warn: {name: Use keeping, lhs: "((),) ^>> first x", rhs: keeping x}
- warn: {name: Use tap, lhs: alongside x >>^ snd, rhs: tap (x >>> done)}
- warn: {name: Use tap, lhs: (returnA &&& x) >>^ fst, rhs: tap (x >>> done)}
- warn: {name: Use consume, lhs: first x >>> (snd ^>> y), rhs: consume x >>> y}
- warn: {name: Use consume, lhs: first x >>^ snd, rhs: consume x}
- warn: {name: Use fst, lhs: consume x >>> done, rhs: fst ^>> x}
- warn: {name: Use deliver, lhs: second x >>> fulfil >>> done, rhs: deliver x}

# The names of both wires of an arrow are written around it by inout.
- warn: {name: Use inout, lhs: "taking x (p `giving` y)", rhs: inout x p y}
- warn: {name: Use inout, lhs: "(taking x p) `giving` y", rhs: inout x p y}

# An effect that returns its own input, or a part of it, makes the value flow through the IO step instead of around it:
# the effect should get only what it reads, and the rest go by tap, alongside, consume, first, second or <*>. The rules
# for a pair come in two: the first applies if the effect doesn't read the part that is kept, and then it is a plain
# first, second or consume; the second if it reads it too, and then the effect gets the whole pair.
- warn: {name: Route around the effect, lhs: "now (\\x -> x <$ e)", rhs: "tap (now (\\x -> () <$ e))"}
- warn: {name: Route around the effect, lhs: "now (\\x -> f x <$ e)", rhs: "tap (now (\\x -> () <$ e)) >>^ f"}
- warn: {name: Route around the effect, lhs: "now (\\x -> e $> f x)", rhs: "tap (now (\\x -> () <$ e)) >>^ f"}
- warn: {name: Route around the effect, lhs: "now (\\x -> e $> x)", rhs: "tap (now (\\x -> () <$ e))"}
- warn: {name: Route around the effect, lhs: "now (\\x -> (x,) <$> e)", rhs: "alongside (now (\\x -> e)) >>^ swap"}
- warn: {name: Route around the effect, lhs: "now (\\x -> (,) x <$> e)", rhs: "alongside (now (\\x -> e)) >>^ swap"}
- warn: {name: Route around the effect, lhs: "now (\\x -> (,x) <$> e)", rhs: "alongside (now (\\x -> e))"}

- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> x <$ e)", rhs: "second (now (\\y -> () <$ e)) >>^ fst", side: notIn x e}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> x <$ e)", rhs: "tap (now (\\(x, y) -> () <$ e)) >>^ fst", side: not (notIn x e)}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> y <$ e)", rhs: "consume (now (\\x -> () <$ e))", side: notIn y e}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> y <$ e)", rhs: "tap (now (\\(x, y) -> () <$ e)) >>^ snd", side: not (notIn y e)}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> (y, x) <$ e)", rhs: "tap (now (\\(x, y) -> () <$ e)) >>^ swap"}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> (x,) <$> e)", rhs: "second (now (\\y -> e))", side: notIn x e}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> (x,) <$> e)", rhs: "(,) <$> arr fst <*> now (\\(x, y) -> e)", side: not (notIn x e)}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> (,y) <$> e)", rhs: "first (now (\\x -> e))", side: notIn y e}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> (,y) <$> e)", rhs: "(,) <$> now (\\(x, y) -> e) <*> arr snd", side: not (notIn y e)}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> (y,) <$> e)", rhs: "first (now (\\x -> e)) >>^ swap", side: notIn y e}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> (y,) <$> e)", rhs: "(,) <$> arr snd <*> now (\\(x, y) -> e)", side: not (notIn y e)}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> (,x) <$> e)", rhs: "second (now (\\y -> e)) >>^ swap", side: notIn x e}
- warn: {name: Route around the effect, lhs: "now (\\(x, y) -> (,x) <$> e)", rhs: "(,) <$> now (\\(x, y) -> e) <*> arr fst", side: not (notIn x e)}

# The same for an effect that has a name in diagrams.
- warn: {name: Route around the effect, lhs: "step s (\\x -> x <$ e)", rhs: "tap (step s (\\x -> () <$ e))"}
- warn: {name: Route around the effect, lhs: "step s (\\x -> f x <$ e)", rhs: "tap (step s (\\x -> () <$ e)) >>^ f"}
- warn: {name: Route around the effect, lhs: "step s (\\x -> e $> f x)", rhs: "tap (step s (\\x -> () <$ e)) >>^ f"}
- warn: {name: Route around the effect, lhs: "step s (\\x -> e $> x)", rhs: "tap (step s (\\x -> () <$ e))"}
- warn: {name: Route around the effect, lhs: "step s (\\x -> (x,) <$> e)", rhs: "alongside (step s (\\x -> e)) >>^ swap"}
- warn: {name: Route around the effect, lhs: "step s (\\x -> (,) x <$> e)", rhs: "alongside (step s (\\x -> e)) >>^ swap"}
- warn: {name: Route around the effect, lhs: "step s (\\x -> (,x) <$> e)", rhs: "alongside (step s (\\x -> e))"}

- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> x <$ e)", rhs: "second (step s (\\y -> () <$ e)) >>^ fst", side: notIn x e}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> x <$ e)", rhs: "tap (step s (\\(x, y) -> () <$ e)) >>^ fst", side: not (notIn x e)}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> y <$ e)", rhs: "consume (step s (\\x -> () <$ e))", side: notIn y e}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> y <$ e)", rhs: "tap (step s (\\(x, y) -> () <$ e)) >>^ snd", side: not (notIn y e)}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> (y, x) <$ e)", rhs: "tap (step s (\\(x, y) -> () <$ e)) >>^ swap"}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> (x,) <$> e)", rhs: "second (step s (\\y -> e))", side: notIn x e}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> (x,) <$> e)", rhs: "(,) <$> arr fst <*> step s (\\(x, y) -> e)", side: not (notIn x e)}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> (,y) <$> e)", rhs: "first (step s (\\x -> e))", side: notIn y e}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> (,y) <$> e)", rhs: "(,) <$> step s (\\(x, y) -> e) <*> arr snd", side: not (notIn y e)}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> (y,) <$> e)", rhs: "first (step s (\\x -> e)) >>^ swap", side: notIn y e}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> (y,) <$> e)", rhs: "(,) <$> arr snd <*> step s (\\(x, y) -> e)", side: not (notIn y e)}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> (,x) <$> e)", rhs: "second (step s (\\y -> e)) >>^ swap", side: notIn x e}
- warn: {name: Route around the effect, lhs: "step s (\\(x, y) -> (,x) <$> e)", rhs: "(,) <$> step s (\\(x, y) -> e) <*> arr fst", side: not (notIn x e)}

# The pass-through in PingPong measures the raw tickets and has to stay as it is.
- ignore: {name: Route around the effect, within: Network.Directions.PingPong}

# The raw ticket primitives are for the library, for the programs of directions that measure them, and for the tests and
# benchmarks. Anywhere else a ticket is made by withTicket, call or concurrently, which abandon it if the wait is
# cancelled. An inbox is made by withInbox, which closes it when its scope ends, and not by inbox and closeInbox.
- functions:
    - name: [ticket, await, abandon, expect, inbox, closeInbox]
      within: [Network.Streaming.*, Network.Streaming.Internal.*, Network.Directions.*, "*Spec", LoansTestSupport, Main.waiter, Main.cancelRun, Main.deadlineRun]
# The default group is off and its "ignore: {}" ignores this hint too, so it is switched on by name.
- error: {name: Avoid restricted function}
